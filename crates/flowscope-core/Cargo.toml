[package]
name = "flowscope-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
agent-client-protocol = { workspace = true }
minijinja = { workspace = true }
jsonschema = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
# bin/dev.rs 日志初始化（EnvFilter）
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# 前端 dist 嵌入（单文件分发；debug-embed 使 dev/测试同样走编译期嵌入路径）
rust-embed = { version = "8", features = ["debug-embed"] }

# 独立无头服务器（单文件分发：嵌入 UI + 随机访问令牌）
[[bin]]
name = "flowscope-server"
path = "src/bin/server.rs"

[dev-dependencies]
# Integration tests spawn the Task-7 mock agent binary; assert_cmd locates it
# (the test helper builds it first — assert_cmd 2.x no longer builds).
assert_cmd = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
